name: Auto Release

on:
  push:
    branches: [main]
    # A release's own blog post is written after the tag, under a 📝 prefix,
    # which the patch rules in .releaserc.json would otherwise read as another
    # release — and that release would want a post of its own, without end. A
    # push carrying nothing but posts changes nothing to release.
    paths-ignore:
      - "website/content/blog/**"

concurrency:
  group: auto-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record existing tags
        id: before
        run: echo "latest=$(git tag -l 'v*' | sort -V | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"

      - name: Install semantic-release plugins
        run: npm install -g semantic-release@25.0.3 semantic-release-gitmoji@1.6.9 @semantic-release/changelog@6.0.3 @semantic-release/git@10.0.1

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Get new tag
        id: tag
        run: |
          LATEST=$(git tag -l 'v*' | sort -V | tail -1)
          BEFORE="${{ steps.before.outputs.latest }}"
          if [ "$LATEST" != "$BEFORE" ]; then
            echo "new_tag=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.tag.outputs.new_tag != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        if: steps.tag.outputs.new_tag != ''
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
